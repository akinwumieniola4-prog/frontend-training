<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love ❤️</title>
    <link rel="stylesheet" href="tell.css">
</head>
<body>

    <div class="hearts">💕 ❤️ 💗 💖 💕</div>

    <div class="container">
        <div class="heart">❤️</div>

        <h1>Hey My Love 💕</h1>

        <p class="word-text">Do you love me? 🥹❤️</p>

        <div class="buttons">
            <button class="yes">Yes ❤️</button>
            <button class="no">No 🙈</button>
        </div>

        <p class="message">You mean so much to me 💖</p>

        <p class="footer">Made with love, just for you 💌</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
