<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">

        <div class="display">
            <h1 id="display">0</h1>
        </div>

        <div class="buttons">

            <button id="Clear-all" class="operator">AC</button>
            <button id="plus & minus" class="operator">÷/-</button>
            <button id="divide"  class="operator">%</button>
            <button class="divide">÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="divide">×</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="divide">-</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="divide">+</button>
       
             <button class="zero">0</button>
            <button>.</button>
            <button class="divide">=</button>

        </div>

    </div>
<script src="script.js"></script>
</body>
</html>
