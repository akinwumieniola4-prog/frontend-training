<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPay Dashboard</title>
  <link rel="stylesheet" href="styl.css">
</head>

<body>

  <div class="container">

    <header>
      <div class="logo">
        <span>O</span>
        <b>Pay</b>
      </div>

      <div class="welcome">
        <p>Welcome back!</p>
        <h2>Enimoney</h2>
      </div>

      <button class="deposit-top">Deposit</button>
      <button class="withdraw-top">Withdraw</button>

      <button class="logout">Logout</button>
    </header>


    <div class="balance">
      <p>Current Balance</p>
      <h1>₦0.00</h1>
    </div>


    <div class="money-box">

      <div class="card">
        <h2>Deposit Money</h2>

        <input type="number" placeholder="Enter amount">

        <button>Deposit</button>
      </div>


      <div class="card">
        <h2>Withdraw Money</h2>

        <input type="number" placeholder="Enter amount">

        <button>Withdraw</button>
      </div>

    </div>


    <div class="transactions">
      <h2>Transaction History</h2>

      <p>No transactions yet.</p>
    </div>

  </div>
<script src="dashboard.js"></script>
</body>
</html>
