<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPay Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
  <div class="logo">
<span>
  <h1>O</h1>
  
</span>
<b>Pay</b>
  </div>

    <h1>Welcome Back</h1>
    <p class="subtitle">Login to your account to continue</p>

    <label>Email or Phone Number</label>
    <input type="text" id="email" placeholder="Enter email or phone number">

    <label>Password</label>
    <div class="password-box">
      <input type="password" id="password" placeholder="Enter password">
      <button id="showPassword">👁</button>
    </div>

    <div class="options">
      <label class="remember">
        <input type="checkbox">
        Remember me
      </label>

      <a href="#">Forgot password?</a>
    </div>

    <button class="login-btn" id="loginBtn">Login</button>

    <div class="or">
      <span></span>
      OR
      <span></span>
    </div>

    <p class="account">
      Don't have an account?
      <a href="#">Create an account</a>
    </p>

    <p class="secure">🔒 Your information is protected and secure.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
