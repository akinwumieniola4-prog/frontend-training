<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a Unit</title>
    <link rel="stylesheet" href="red.css">
</head>

<body>

    <div class="container">

        <h1>Choose a Unit</h1>

        <p>Select a unit from the dropdown.</p>

        <button class="unit">Miles</button>

        <div class="choices">
            <p class="kilometres">Kilometres</p>
            <p class="miles">Miles</p>
            <p class="metres">Metres</p>
            <p class="feet">Feet</p>
        </div>

        <h2 class="result">miles</h2>

    </div>

    <script src="yellow.js"></script>

</body>
</html>
