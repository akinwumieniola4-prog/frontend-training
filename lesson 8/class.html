<!DOCTYPE html>
<html>
    <head>
        <title>Animations</title>
        <style>
            .head{
                width: 300px;
                height: 80px;
                background-color: white;
                text-align: center;
                display: flex;
                align-items: center;
                flex-direction: row;
                justify-content: center;
                border-radius: 9px;
                border: 5px solid blue;

            }
            .head{
                animation: color 10s infinite;
            }
            @keyframes color{
                25%{color: black;}
                50%{color: red;}
                70%{color: blue;}
                100%{color: green;}
            }
            .head{
                width: 300px;
                height: 80px;
                background-color: white;
                text-align: center;
                display: flex;
                align-items: center;
                flex-direction: row;

                border: 5px solid blue;

            }
            .head{
                animation: color 10s infinite;
            }
            @keyframes color{
                25%{color: black;}
                50%{color: red;}
                70%{color: blue;}
                100%{color: green;}
            }
            .tap {
                display: flex;
                gap: 40px;
            }
        </style>
    </head>
    <body>
        <div class="tap"><div class="head">
            <h1>Color Animations</h1>
        </div>
        <div class="head">
            <h1>Eniola</h1>
        </div></div>
        


    </body>
</html>
